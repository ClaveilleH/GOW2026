<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>GOW2026 - Babylon.js</title>
    <link rel="stylesheet" href="src/style.css">
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- <script src="lib/babylon.max.js"></script> -->
    <script src="src/hud.js"></script>
    <script type="module" src="src/main.js"></script>
</head>
<body>
    <!-- <canvas id="myCanvas" width=1600 height=1200></canvas> -->
    <canvas id="myCanvas"></canvas>

    <!-- HUD -->
    <div id="hud" >
        Vitesse: 0 | FPS: 0
    </div>
    <div id="menuContainer" style="
        position:absolute;
        top:10px;
        right:10px;
        z-index:1000;
        ">

        <button id="menuToggleBtn">☰ Menu</button>

        <div id="menuPanel" style="display:none;">
            <button id="toggleGraphBtn">Afficher Graph</button>
            <!-- Tu peux ajouter d'autres boutons ici -->
            <button id="debugAi">Debug AI</button>
            <button id="btnOption2">Option 2</button>
        </div>

    </div>
    <canvas id="metricsCanvas"
        width="400"
        height="120"
        style="
          position:absolute;
          left:10px;
          top:60px;
          background:rgba(0,0,0,0.6);
          border:1px solid #0ff;
          z-index:9;
        ">
    </canvas>

</body>
</html>
